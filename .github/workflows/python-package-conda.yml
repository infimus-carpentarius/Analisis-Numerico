name: CI with Conda

on:
  push:
    branches: [ Principal, main ]
  pull_request:
    branches: [ Principal, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-all-chapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # permite que otros capítulos sigan ejecutándose aunque uno falle
    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.13.12'
          

      - name: Find and test all chapters
        shell: bash -l {0}
        run: |
          # Busca todas las carpetas con pyproject.toml (ignora la raíz si también tiene)
          for chapter in $(find . -maxdepth 2 -name "pyproject.toml" -printf "%h\n" | grep -v '^\.$'); do
            echo "========================================"
            echo "Testing chapter: $chapter"
            echo "========================================"
            cd $chapter

            # Verificar que exista environment.yml
            if [ ! -f "environment.yml" ]; then
              echo "⚠️ No environment.yml found in $chapter, skipping Conda env creation"
            else
              # Crear entorno Conda desde el archivo del capítulo
              conda env create -f environment.yml
              # Activar el entorno (se asume que el nombre es 'jnotebook' o el definido en el yml)
              conda activate jnotebook
            fi

            # Instalar el paquete en modo editable (usa pyproject.toml)
            pip install -e .

            # Ejecutar pruebas
            pytest tests/ -v --tb=short
            if [ $? -ne 0 ]; then
              echo "❌ Tests failed in $chapter"
              exit 1
            fi

            # Limpiar (opcional)
            conda deactivate
            cd $OLDPWD
          done
